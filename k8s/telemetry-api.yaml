apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-api
  template:
    metadata:
      labels:
        app: telemetry-api
    spec:
      containers:
      - name: telemetry-api
        image: cloudroute-telemetry:v2
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "redis"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
spec:
  type: LoadBalancer
  selector:
    app: telemetry-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
